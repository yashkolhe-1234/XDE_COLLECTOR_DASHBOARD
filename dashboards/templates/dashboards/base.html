<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Collector Dashboard</title>

    <style>
        /* ===== GLOBAL ===== */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        h2, h3, h4 {
            margin: 0;
        }

        /* ===== LAYOUT ===== */
        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 240px;
            background-color: #1f2937;
            color: #ffffff;
            padding: 20px;
        }

        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .sidebar a:hover {
            background-color: #374151;
            color: #ffffff;
        }

        /* ===== MAIN AREA ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            background-color: #ffffff;
            padding: 15px 20px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 18px;
            font-weight: bold;
        }

        /* ===== CONTENT ===== */
        .content {
            padding: 20px;
        }

        /* ===== KPI CARDS ===== */
        .kpi-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .kpi-card h4 {
            font-size: 14px;
            color: #6b7280;
        }

        .kpi-value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
            color: #111827;
        }

        /* ===== CHART BOX ===== */
        .chart-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            min-height: 220px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .chart-box h4 {
            font-size: 14px;
            color: #374151;
            margin-bottom: 15px;
        }

        .chart-box canvas {
            max-height: 300px;
        }

        .chart-placeholder {
            margin-top: 20px;
            height: 140px;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            border-radius: 6px;
            font-size: 13px;
        }

        /* ===== TABLE ===== */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
            font-size: 14px;
        }

        .data-table th {
            background: #f9fafb;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>Collector Dashboard</h2>

        {% for item in sidebar_items %}
            <a href="{{ item.url }}">{{ item.label }}</a>
        {% endfor %}
    </div>

    <!-- MAIN CONTENT -->
    <div class="main">

        <!-- HEADER -->
        <div class="header">
            {{ page_title|default:"Dashboard" }}
        </div>

        <!-- PAGE CONTENT -->
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>

    </div>

</div>

</body>
</html>
